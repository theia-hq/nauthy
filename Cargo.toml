[package]
name = "nauthy"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
# theia
bifrost-core = { git = "https://github.com/theia-hq/bifrost" }

biscuit-auth = "6"
data-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "fs"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[lints.rust]
unused_must_use = "deny"
