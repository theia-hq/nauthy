[package]
name = "nauthy"
description = "Capability tokens rooted at one ed25519 key: mint, narrow, verify offline, revoke. No server."
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
# Git-only for now: consumed as a git dependency, not published to crates.io. Flip when the API and
# review maturity justify a registry release.
publish = false

[features]
default = ["fs", "os-rng"]
# The file-backed revocation store (`Denylist`), over synchronous std file I/O. Off in a no-filesystem
# core: the `Revocations` trait, `Gate`, `Cap`, and `Identity` build with no file access at all.
fs = []
# The no-argument `Identity::generate`, seeded from the OS CSPRNG. Off for a no-OS consumer, which still
# has `Identity::from_rng` with a caller-supplied CSPRNG.
os-rng = ["rand_core/getrandom"]

[dependencies]
biscuit-auth = "6"
data-encoding = "2"
# The raw ed25519 signer/verifier for the roster document (a detached signature over a blob, not a biscuit
# token). Already in the tree transitively via biscuit-auth; declared directly so the roster primitive signs
# with a plain, obvious ed25519 signature rather than smuggling a document into an authorization token.
ed25519-dalek = "2"
# The advisory `flock` that serializes denylist writers. Already in the tree transitively; declared
# directly so the syscall rides the standard binding rather than a hand-declared symbol.
libc = "0.2"
# Decode a token's protobuf frame to read each block's key algorithm and external signature BEFORE any
# signature is checked (`Cap::parse`), which biscuit's own parse only exposes after it has verified the
# chain. Already in the tree through biscuit-auth; pinned to its major so `Message` is the same trait
# biscuit's schema types derive, and a biscuit bump that moves prost fails to compile rather than drift.
prost = "0.10"
# The CSPRNG traits `Identity::from_rng` accepts, so keygen needs no OS dependency in the core; the
# OS-seeded `Identity::generate` is behind `os-rng`, which turns on rand_core's own `getrandom`.
rand_core = "0.6"
thiserror = "2"
# Wipe the 32 secret bytes off the stack after a fresh keypair is built (`Identity::from_rng`).
zeroize = "1"

[dev-dependencies]
# Compile-time NEGATIVE-trait assertion that the single-use `Admitted` witness stays !Clone + !Copy: a
# `#[derive(Clone)]` slip would re-arm replay, and this crate fails to compile (test build) if one lands.
static_assertions = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"

[lints.rust]
unused_must_use = "deny"
